<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Nguyễn Thái Hảo — Software Engineer</title>
  <desc id="desc">A refined animated profile header for KanzuWakazaki, focused on AI systems, developer tooling, and product engineering.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.52" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ba7ff"/>
      <stop offset="0.5" stop-color="#b8c6ff"/>
      <stop offset="1" stop-color="#7dd3c7"/>
    </linearGradient>
    <linearGradient id="softLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ba7ff" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#b8c6ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7dd3c7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9fb4ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#9fb4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur32" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="blur10" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="24"/>
    </clipPath>
    <style>
      .eyebrow { font: 650 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.8px; }
      .name { font: 720 56px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -1.6px; }
      .role { font: 520 23px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.15px; }
      .tagline { font: 430 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .pill-label { font: 680 11px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .92px; }
      .orbit-label { font: 650 11px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.7px; }
      .monogram { font: 700 84px Georgia, "Times New Roman", serif; }
      .fade-1 { animation: settle 900ms cubic-bezier(.22,.8,.25,1) both; }
      .fade-2 { animation: settle 900ms 130ms cubic-bezier(.22,.8,.25,1) both; }
      .fade-3 { animation: settle 900ms 260ms cubic-bezier(.22,.8,.25,1) both; }
      .fade-4 { animation: settle 900ms 390ms cubic-bezier(.22,.8,.25,1) both; }
      .float-a { transform-origin: 985px 171px; animation: floatA 12s ease-in-out infinite; }
      .float-b { transform-origin: 1005px 171px; animation: floatB 15s ease-in-out infinite; }
      .sweep { animation: sweep 7s ease-in-out infinite; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      @keyframes settle {
        from { transform: translateY(7px); }
        to { transform: translateY(0); }
      }
      @keyframes floatA {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
        50% { transform: translate3d(-8px, -7px, 0) rotate(-1.5deg); }
      }
      @keyframes floatB {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
        50% { transform: translate3d(9px, 6px, 0) rotate(2deg); }
      }
      @keyframes sweep {
        0%, 16% { transform: translateX(-390px); opacity: 0; }
        36%, 58% { opacity: 1; }
        84%, 100% { transform: translateX(390px); opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: .45; }
        50% { opacity: .82; }
      }
      @media (prefers-reduced-motion: reduce) {
        .fade-1, .fade-2, .fade-3, .fade-4, .float-a, .float-b, .sweep, .pulse { animation: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>

    <circle cx="1060" cy="35" r="245" fill="url(#orb)" filter="url(#blur32)" class="pulse"/>
    <circle cx="875" cy="355" r="170" fill="#4f6eb8" opacity="0.08" filter="url(#blur32)"/>

    <g opacity="0.11">
      <path d="M0 78H1200M0 180H1200M0 282H1200" stroke="#dce5ff" stroke-width="1"/>
      <path d="M96 0V360M300 0V360M504 0V360M708 0V360M912 0V360M1116 0V360" stroke="#dce5ff" stroke-width="1"/>
    </g>

    <rect x="58" y="48" width="240" height="34" rx="17" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="78" cy="65" r="4" fill="#88b6ff"/>
    <text x="92" y="70" fill="#cbd7f8" class="eyebrow fade-1">KANZUWAKAZAKI</text>

    <text x="58" y="151" fill="#f5f7ff" class="name fade-2">NGUYỄN THÁI HẢO</text>
    <text x="60" y="196" fill="#b8c6e6" class="role fade-3">Software Engineer · AI Systems · Developer Tooling</text>
    <text x="60" y="237" fill="#9aa9c8" class="tagline fade-4">Building reliable AI-assisted products from system design to production.</text>

    <rect x="59" y="271" width="420" height="2" rx="1" fill="#ffffff" fill-opacity="0.10"/>
    <g class="sweep">
      <rect x="59" y="270" width="190" height="4" rx="2" fill="url(#softLine)" filter="url(#blur10)" opacity="0.8"/>
      <rect x="59" y="271" width="190" height="2" rx="1" fill="url(#softLine)"/>
    </g>

    <g class="fade-4">
      <rect x="59" y="297" width="112" height="30" rx="15" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="76" cy="312" r="3" fill="#8ba7ff"/>
      <text x="87" y="316" fill="#c8d3ef" class="pill-label">AI SYSTEMS</text>

      <rect x="183" y="297" width="132" height="30" rx="15" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="200" cy="312" r="3" fill="#7dd3c7"/>
      <text x="211" y="316" fill="#c8d3ef" class="pill-label">BACKEND &amp; APIs</text>

      <rect x="327" y="297" width="174" height="30" rx="15" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="344" cy="312" r="3" fill="#b8c6ff"/>
      <text x="355" y="316" fill="#c8d3ef" class="pill-label">PRODUCT ENGINEERING</text>
    </g>

    <g class="float-b" opacity="0.72">
      <circle cx="1005" cy="171" r="112" fill="none" stroke="#b8c6ff" stroke-opacity="0.12"/>
      <circle cx="1005" cy="171" r="87" fill="#ffffff" fill-opacity="0.022" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="1082" cy="120" r="5" fill="#8ba7ff"/>
      <circle cx="928" cy="225" r="3" fill="#7dd3c7"/>
    </g>

    <g class="float-a">
      <circle cx="985" cy="171" r="64" fill="#ffffff" fill-opacity="0.035" stroke="url(#accent)" stroke-opacity="0.55"/>
      <path d="M947 190c23-7 47-7 76 0" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
      <path d="M951 203c20-5 41-5 68 0" fill="none" stroke="#a8b8e8" stroke-opacity="0.34" stroke-width="1.5" stroke-linecap="round"/>
      <text x="985" y="171" text-anchor="middle" dominant-baseline="central" fill="#f4f6ff" class="monogram">H</text>
    </g>
    <text x="985" y="268" text-anchor="middle" fill="#8798bb" class="orbit-label fade-4">AI · BACKEND · DX</text>

    <path d="M760 318C905 288 1030 292 1200 236" fill="none" stroke="url(#accent)" stroke-opacity="0.18" stroke-width="1.5"/>
    <path d="M820 332C965 306 1085 300 1200 266" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
