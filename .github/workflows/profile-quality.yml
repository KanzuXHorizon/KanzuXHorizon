name: Validate profile

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - README.md
      - package.json
      - assets/**
      - scripts/**
      - tests/**
      - .github/**

permissions:
  contents: read

concurrency:
  group: profile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test generator and profile assets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run generator checks
        run: npm run check

      - name: Generate a live profile preview
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
          PROFILE_FEATURED_REPOSITORIES: ${{ vars.PROFILE_FEATURED_REPOSITORIES }}
          PROFILE_METRICS_OUTPUT: ${{ runner.temp }}/profile-assets/profile-metrics.svg
          PROFILE_METRICS_MOBILE_OUTPUT: ${{ runner.temp }}/profile-assets/profile-metrics-mobile.svg
        run: npm run generate:profile

      - name: Validate README and SVG assets
        run: python3 scripts/validate-profile.py --generated-dir "${{ runner.temp }}/profile-assets"
