name: Refresh contribution animation

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/contribution-snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6f89d8&color_dots=#ebedf0,#c8d4f4,#9fb3ea,#738ed8,#4f69b8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#b8c6ff&color_dots=#161b22,#26365c,#40558d,#6379bd,#91a6ea

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
